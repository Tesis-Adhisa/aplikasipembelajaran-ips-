        function FlashcardsGame({ topicId, onComplete }) {
            const cards = TOPIC_FLASHCARDS[topicId] || [];
            const [currentIndex, setCurrentIndex] = useState(0);
            const [isFlipped, setIsFlipped] = useState(false);
            const [completed, setCompleted] = useState(false);
            const [isTransitioning, setIsTransitioning] = useState(false);
            const transitioningRef = useRef(false); // Ref untuk guard sinkron (state saja tidak cukup cepat untuk menahan klik beruntun)

            if (cards.length === 0) return null;

            const handleNext = () => {
                if (transitioningRef.current) return; // Cegah klik ganda cepat merusak urutan kartu
                transitioningRef.current = true;
                setIsTransitioning(true);
                setIsFlipped(false);
                const isLastCard = currentIndex >= cards.length - 1;
                setTimeout(() => {
                    if (!isLastCard) {
                        setCurrentIndex(prev => prev + 1);
                    } else {
                        setCompleted(true);
                        onComplete(30, topicId); // Beri bonus 30 XP (dikurangi jika sudah pernah selesai sebelumnya)
                    }
                    transitioningRef.current = false;
                    setIsTransitioning(false);
                }, 200);
            };

            const handleReset = () => {
                setCurrentIndex(0);
                setIsFlipped(false);
                setCompleted(false);
                transitioningRef.current = false;
                setIsTransitioning(false);
            };

            return (
                <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-4">
                    <div className="flex items-center justify-between">
                        <div className="flex items-center gap-2">

                                <p className="text-xs text-slate-500">Klik kartu untuk membalik dan melihat jawaban arti istilah</p>
                            </div>
                        </div>
                        <span className="text-xs font-bold text-slate-400">
                            {!completed ? `${currentIndex + 1} / ${cards.length}` : "Selesai"}
                        </span>
                    </div>

                    {!completed ? (
                        <div className="space-y-4">
                            <div 
                                onClick={() => setIsFlipped(!isFlipped)}
                                className="h-44 w-full cursor-pointer perspective bg-slate-50 rounded-xl border border-slate-200 shadow-sm flex items-center justify-center p-6 text-center select-none relative hover:border-amber-400 transition"
                            >
                                <span className="absolute top-2 right-3 text-[10px] text-slate-400 font-semibold">Klik Untuk Balik Kartu 🔄</span>
                                <div>
                                    {!isFlipped ? (
                                        <div>
                                            <span className="text-[10px] font-bold text-amber-600 uppercase tracking-wider block mb-1">Istilah / Konsep</span>
                                            <h3 className="font-extrabold text-lg text-slate-800">{cards[currentIndex].front}</h3>
                                        </div>
                                    ) : (
                                        <div>
                                            <span className="text-[10px] font-bold text-emerald-600 uppercase tracking-wider block mb-1">Definisi / Arti</span>
                                            <p className="text-xs text-slate-700 leading-relaxed font-semibold">{cards[currentIndex].back}</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                            <div className="flex justify-end">
                                <button 
                                    onClick={handleNext}
                                    disabled={isTransitioning}
                                    className="bg-amber-500 hover:bg-amber-600 disabled:opacity-60 disabled:cursor-not-allowed text-white font-bold text-xs py-2 px-4 rounded-xl flex items-center gap-1 cursor-pointer transition shadow-sm"
                                >

                                </button>
                            </div>
                        </div>
                    ) : (
                        <div className="text-center py-6 space-y-3">
                            <div className="inline-block bg-amber-100 text-amber-600 p-3 rounded-full">🏆</div>

                                onClick={handleReset}
                                className="border border-slate-200 hover:bg-slate-100 font-bold text-xs py-1.5 px-4 rounded-lg cursor-pointer transition flex items-center gap-1 mx-auto"
                            >
                                <span>Ulangi Kembali</span>
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        // 5. COMPONENT: INTERACTIVE QUIZ GAME 
        function QuizGame({ quiz, topicTitle, onComplete, onClose }) {
            const [currentIndex, setCurrentIndex] = useState(0);
            const [selectedOption, setSelectedOption] = useState(null);
            const [isAnswered, setIsAnswered] = useState(false);
            const [score, setScore] = useState(0);
            const [isFinished, setIsFinished] = useState(false);

            const handleCheck = () => {
                if (selectedOption === null || isAnswered) return;
                setIsAnswered(true);
                if (selectedOption === quiz[currentIndex].correctAnswer) {
                    setScore(prev => prev + 1);
                }
            };

            const handleNext = () => {
                if (currentIndex < quiz.length - 1) {
                    setCurrentIndex(prev => prev + 1);
                    setSelectedOption(null);
                    setIsAnswered(false);
                } else {
                    const pct = Math.round((score / quiz.length) * 100);
                    const pts = score * 50;
                    setIsFinished(true);
                    onComplete(pct, pts);
                }
            };

            return (
                <div className="bg-slate-50 border border-slate-200 rounded-2xl p-5 shadow-sm space-y-4">
                    {!isFinished ? (
                        <div className="space-y-4">
                            <div className="flex justify-between items-center">
                                <div>
                                    <span className="text-[10px] font-bold text-blue-600 uppercase tracking-wider block">Kuis Evaluasi</span>
                                    <h4 className="text-xs font-bold text-slate-600 truncate max-w-xs">{topicTitle}</h4>
                                </div>
                                <span className="text-xs font-bold text-slate-400">Soal {currentIndex + 1} dari {quiz.length}</span>
                            </div>

                            <div className="bg-white p-4 rounded-xl border border-slate-100 shadow-sm text-xs font-semibold leading-relaxed text-slate-800">
                                {quiz[currentIndex].question}
                            </div>

                            <div className="grid grid-cols-1 gap-2">
                                {quiz[currentIndex].options.map((opt, idx) => {
                                    let style = 'border-slate-200 hover:bg-slate-100 text-slate-700';
                                    if (selectedOption === idx && !isAnswered) {
                                        style = 'border-blue-500 bg-blue-50 text-blue-700 font-semibold';
                                    } else if (isAnswered) {
                                        if (idx === quiz[currentIndex].correctAnswer) {
                                            style = 'border-emerald-500 bg-emerald-50 text-emerald-800 font-bold';
                                        } else if (selectedOption === idx && idx !== quiz[currentIndex].correctAnswer) {
                                            style = 'border-red-500 bg-red-50 text-red-800';
                                        } else {
                                            style = 'border-slate-100 text-slate-400 bg-slate-50/50';
                                        }
                                    }
                                    return (
                                        <button 
                                            key={idx}
                                            onClick={() => !isAnswered && setSelectedOption(idx)}
                                            className={`text-left p-3.5 rounded-xl border text-xs cursor-pointer transition ${style}`}
                                            disabled={isAnswered}
                                        >
                                            {opt}
                                        </button>
                                    );
                                })}
                            </div>

                            {isAnswered && (
                                <div className="p-3 bg-slate-100 border border-slate-200 rounded-xl text-[11px] leading-relaxed text-slate-600 space-y-1">
                                    <strong className="text-slate-800 block">Pembahasan Soal:</strong>
                                    <p>{quiz[currentIndex].explanation}</p>
                                </div>
                            )}

                            <div className="flex justify-between items-center pt-3 border-t border-slate-200">

                            </button>

                    )}
                </div>
            );
        }

        // 6. MAIN APP COMPONENT
        function App() {
            const [layer, setLayer] = useState('landing'); // landing, grades, subjects, topics, study
            const [selectedGrade, setSelectedGrade] = useState('X');
            const [selectedSubject, setSelectedSubject] = useState(null);
            const [selectedTopic, setSelectedTopic] = useState(null);
            const [activeQuiz, setActiveQuiz] = useState(null);
            const [isSpeaking, setIsSpeaking] = useState(false);

            const [progress, setProgress] = useState({
                completedTopics: [],
                quizScores: {},
                completedFlashcards: [],
                points: 100
            });

            useEffect(() => {
                try {
                    const saved = localStorage.getItem('ips_harapan_siswa_progress');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        // Merge dengan default agar data lama (sebelum fitur baru ditambahkan) tetap kompatibel
                        setProgress(prev => ({ ...prev, ...parsed }));
                    }
                } catch (e) {
                    console.warn('Progress belajar tersimpan tidak dapat dibaca, memulai dari awal.', e);
                }
            }, []);

            useEffect(() => {
                // Instantly sync Lucide icons on DOM updates
                try {
                    if (window.lucide) {
                        window.lucide.createIcons();
                    }
                } catch (e) {
                    console.warn('Ikon Lucide gagal dimuat (kemungkinan tidak ada koneksi internet).', e);
                }
            });

            const saveProgress = (newProg) => {
                setProgress(newProg);
                try {
                    localStorage.setItem('ips_harapan_siswa_progress', JSON.stringify(newProg));
                } catch (e) {
                    console.warn('Progress belajar tidak dapat disimpan secara permanen di perangkat ini.', e);
                }
            };

            const handleCompleteQuiz = (scorePct, ptsEarned) => {
                if (!selectedTopic) return;
                const completed = progress.completedTopics.includes(selectedTopic.id);
                const updatedCompleted = completed ? progress.completedTopics : [...progress.completedTopics, selectedTopic.id];
                const high = progress.quizScores[selectedTopic.id] || 0;
                const updatedScores = { ...progress.quizScores, [selectedTopic.id]: Math.max(high, scorePct) };
                
                saveProgress({
                    ...progress,
                    completedTopics: updatedCompleted,
                    quizScores: updatedScores,
                    points: progress.points + (completed ? Math.round(ptsEarned / 2) : ptsEarned)
                });
            };

            const handleCompleteFlash = (pts, topicId) => {
                const currentList = progress.completedFlashcards || [];
                const alreadyClaimed = currentList.includes(topicId);
                saveProgress({
                    ...progress,
                    completedFlashcards: alreadyClaimed ? currentList : [...currentList, topicId],
                    points: progress.points + (alreadyClaimed ? Math.round(pts / 3) : pts)
                });
            };

            const toggleSpeech = (text) => {
                if ('speechSynthesis' in window) {
                    if (isSpeaking) {
                        window.speechSynthesis.cancel();
                        setIsSpeaking(false);
                    } else {
                        window.speechSynthesis.cancel();
                        const utterance = new SpeechSynthesisUtterance(text);
                        utterance.lang = 'id-ID';
                        utterance.rate = 0.95;
                        utterance.onend = () => setIsSpeaking(false);
                        utterance.onerror = () => setIsSpeaking(false);
                        setIsSpeaking(true);
                        window.speechSynthesis.speak(utterance);
                    }
                } else {
                    alert('Layanan narator suara tidak didukung di komputer Anda.');
                }
            };

            const resetProgress = () => {
                if (confirm('Apakah Anda yakin ingin mengulang progress belajar dari awal?')) {
                    saveProgress({ completedTopics: [], quizScores: {}, completedFlashcards: [], points: 100 });
                }
            };

            const getSubjectProgress = (sub) => {
                if (!sub.topics || sub.topics.length === 0) return 0;
                const completed = sub.topics.filter(t => progress.completedTopics.includes(t.id)).length;
                return Math.round((completed / sub.topics.length) * 100);
            };

            return (
                <div className="min-h-screen bg-slate-50 text-slate-800 flex flex-col">
                    {/* Header bar */}
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-30 px-4 py-3 shadow-sm">
                        <div className="max-w-7xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                {layer !== 'landing' && (
                                    <button 
                                        onClick={() => {
                                            if (layer === 'study') { setLayer('topics'); setActiveQuiz(null); if('speechSynthesis' in window) window.speechSynthesis.cancel(); setIsSpeaking(false); }
                                            else if (layer === 'topics') setLayer('subjects');
                                            else if (layer === 'subjects') setLayer('grades');
                                            else if (layer === 'grades') setLayer('landing');
                                        }}
                                        className="hover:bg-slate-100 p-2 rounded-full border border-slate-200 transition cursor-pointer"
                                    >
                                        <i data-lucide="chevron-left" className="w-4 h-4 text-slate-600"></i>
                                    </button>
                                )}

                                    <h1 className="font-extrabold text-base md:text-lg tracking-tight text-slate-900 flex items-center gap-1.5">
                                        <span className="text-xl">🎓</span>
                                        <span>IPS Harapan Siswa</span>
                                    </h1>
                                    <p className="text-[10px] text-slate-400 hidden sm:block">SMK Harapan Siswa Bogor • Media Belajar Mandiri</p>
                                </div>
                            </div>

                            <div className="flex items-center gap-3 text-xs font-bold">
                                <div className="bg-amber-50 border border-amber-100 text-amber-900 rounded-full py-1 px-3 flex items-center gap-1">

                                </div>
                                <div className="bg-blue-50 border border-blue-100 text-blue-900 rounded-full py-1 px-3 flex items-center gap-1">

                                        onClick={() => setLayer('grades')}

                                        <h3 className="font-bold text-slate-800 text-sm">Materi Lengkap SMK</h3>
                                        <p className="text-xs text-slate-500 leading-relaxed">Mencakup 4 pilar IPS utama: Geografi, Sejarah Indonesia, Ekonomi, dan Sosiologi yang disesuaikan khusus siswa SMK.</p>
                                    </div>
                                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-2">
                                        <span className="text-xl">🎮</span>
                                        <h3 className="font-bold text-slate-800 text-sm">Gamifikasi Kuis & Flashcards</h3>
                                        <p className="text-xs text-slate-500 leading-relaxed">Asah daya ingatmu lewat kuis interaktif dengan pembahasan instan dan kartu pintar penghafal istilah praktis.</p>
                                    </div>
                                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-2">
                                        <span className="text-xl">📊</span>
                                        <h3 className="font-bold text-slate-800 text-sm">Peta Konsep & Glosarium</h3>

                                                <strong className="text-slate-800 block text-sm">Kelas X (Sepuluh)</strong>

                                                <span className="text-xs text-slate-500">4 Disiplin Ilmu • 8 Materi Pokok SMK Lengkap</span>
                                            </div>
                                        </div>
                                        <div className="bg-indigo-50 text-indigo-600 p-2 rounded-full">➡️</div>
                                    </button>
                                    <button

                                        className="w-full bg-white p-5 rounded-2xl border-2 border-rose-500 text-left hover:shadow-md transition flex items-center justify-between cursor-pointer"
                                    >
                                        <div className="flex items-center gap-4">
                                            <div className="bg-rose-600 text-white p-3 rounded-xl">🎓</div>
                                            <div>
                                                <strong className="text-slate-800 block text-sm">Kelas XII (Duabelas)</strong>
                                                <span className="text-xs text-slate-500">4 Disiplin Ilmu • 8 Materi Pokok Persiapan Kelulusan</span>

                                        <div className="bg-rose-50 text-rose-600 p-2 rounded-full">➡️</div>
                                    </button>
                                </div>
                            </div>

                                                        </div>
                                                    </div>
                                                </div>
                                            </button>

                                </div>
                                <div className="pt-6 border-t border-slate-200">
                                    <IpsGlossary />
                                </div>
                            </div>
                        )}

                        {/* TOPIC SELECTION */}
                        {layer === 'topics' && selectedSubject && (
                            <div className="space-y-6 max-w-2xl mx-auto">
                                <div className={`p-6 rounded-2xl ${selectedSubject.headerColor} text-white space-y-2`}>
                                    <span className="text-[10px] bg-white/25 px-2.5 py-0.5 rounded-full font-extrabold uppercase">{selectedSubject.name} - Kelas {selectedGrade}</span>
                                    <h2 className="text-xl md:text-2xl font-black">{selectedSubject.topics.length} Materi Pembelajaran</h2>
                                    <div className="space-y-1 max-w-xs pt-1">
                                        <div className="flex justify-between text-xs font-semibold">
                                            <span>Progress Pembelajaran:</span>
                                            <span>{getSubjectProgress(selectedSubject)}%</span>
                                        </div>
                                        <div className="w-full h-1 bg-white/20 rounded-full overflow-hidden">
                                            <div className="h-full bg-white" style={{ width: `${getSubjectProgress(selectedSubject)}%` }}></div>
                                        </div>
                                    </div>
                                </div>

                                <div className="space-y-2">
                                    <span className="text-[10px] font-bold text-slate-400 block uppercase">Daftar Modul Materi Pembelajaran:</span>
                                    {selectedSubject.topics.map((topic, idx) => {
                                        const comp = progress.completedTopics.includes(topic.id);
                                        const score = progress.quizScores[topic.id];
                                        return (
                                            <button 
                                                key={topic.id}
                                                onClick={() => { setSelectedTopic(topic); setLayer('study'); }}
                                                className="w-full bg-white p-4 rounded-xl border border-slate-200 hover:border-blue-400 text-left transition flex items-center justify-between cursor-pointer"

                                                <div className="flex items-center gap-3">
                                                    <div className={`w-8 h-8 rounded-lg flex items-center justify-center font-bold text-xs ${comp ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-600'}`}>

                                                <button 
                                                    onClick={() => setActiveQuiz(selectedTopic)}
                                                    className="w-full bg-blue-600 hover:bg-blue-500 text-white font-extrabold text-xs py-2 px-4 rounded-xl cursor-pointer transition shadow-md"
                                                >
                                                    Mulai Kuis Interaktif
                                                </button>
                                            </div>
                                        )}

                                        <FlashcardsGame 
                                            topicId={selectedTopic.id}
                                            onComplete={handleCompleteFlash}
                                        />
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Footer bar */}
                    <footer className="bg-slate-950 text-slate-500 py-6 px-4 mt-12 border-t border-slate-900 text-center text-[11px] space-y-1.5">
                        <strong className="text-slate-400 block">© 2026 SMK Harapan Siswa Bogor</strong>
                        <p className="max-w-md mx-auto text-slate-600 leading-relaxed">Media pembelajaran digital IPS kelas X mandiri dengan kuis interaktif, flashcards, dan infografis. Berjalan 100% offline & client-side.</p>
                    </footer>
                </div>
            );
        }

        // Render React App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
