            { term: 'Kelangkaan (Scarcity)', definition: 'Masalah inti ekonomi di mana jumlah keinginan manusia tidak terbatas, sedangkan sumber daya alam pemuasnya sangat terbatas.', subject: 'Ekonomi' },
            { term: 'Biaya Peluang', definition: 'Manfaat atau potensi terbaik yang terpaksa dikorbankan demi mengambil satu keputusan ekonomi terpilih dibandingkan opsi lainnya.', subject: 'Ekonomi' },
            { term: 'Oikonomia', definition: 'Bahasa Yunani kuno asal kata ekonomi, di mana oikos berarti rumah tangga dan nomos berarti aturan/hukum.', subject: 'Ekonomi' },
            { term: 'Koperasi', definition: 'Badan usaha ekonomi rakyat yang dikelola bersama berasaskan kekeluargaan demi meningkatkan kesejahteraan segenap anggotanya.', subject: 'Ekonomi' },
            { term: 'BUMN', definition: 'Badan Usaha Milik Negara yang bertugas memproduksi cabang vital ekonomi demi hajat hidup rakyat banyak sekaligus penopang pembangunan.', subject: 'Ekonomi' },
            { term: 'Praaksara', definition: 'Masa kuno kehidupan manusia purba sebelum mereka mengenal tulisan atau sistem aksara pencatatan sejarah.', subject: 'Sejarah' },
            { term: 'Nomaden', definition: 'Pola kehidupan masyarakat purba yang berpindah-pindah tempat tinggal karena memburu binatang atau mencari pangan musiman di alam liar.', subject: 'Sejarah' },
            { term: 'Sedenter', definition: 'Gaya hidup menetap di suatu wilayah perkampungan berkelanjutan karena mulai mahir memproduksi bahan makanan mandiri (bercocok tanam).', subject: 'Sejarah' },
            { term: 'Prasasti', definition: 'Piagam kuno, maklumat, atau ukiran tulisan resmi pada batu/tembaga peninggalan kerajaan kuno di Nusantara.', subject: 'Sejarah' },
            { term: 'Purnawarman', definition: 'Raja agung legendaris Kerajaan Tarumanegara Jawa Barat yang terkenal cerdas, berani, serta membangun irigasi saluran Sungai Gomati.', subject: 'Sejarah' }
        ];

        function IpsGlossary() {
            const [search, setSearch] = useState('');
            const [filterTab, setFilterTab] = useState('Semua');

            const filtered = GLOSSARY_ITEMS.filter(item => {
                const matchesSearch = item.term.toLowerCase().includes(search.toLowerCase()) || 
                                      item.definition.toLowerCase().includes(search.toLowerCase());
                const matchesFilter = filterTab === 'Semua' || item.subject === filterTab;
                return matchesSearch && matchesFilter;
            });

            return (
                <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-4">
                    <div className="flex items-center justify-between">
                        <div className="flex items-center gap-2.5">
                            <div className="bg-blue-50 text-blue-600 p-2 rounded-lg"><i data-lucide="book-open"></i></div>
                            <div>
                                <h4 className="font-bold text-slate-800 text-sm md:text-base">Kamus Glosarium IPS Offline</h4>
                                <p className="text-xs text-slate-500">Cari & pelajari istilah penting geografi, sosiologi, sejarah & ekonomi</p>
                            </div>
                        </div>
                    </div>

                    <div className="relative">
                        <input 
                            type="text" 
                            placeholder="Cari kata (contoh: Nomaden, Scarcity)..."
                            value={search}
                            onChange={(e) => setSearch(e.target.value)}
                            className="w-full bg-slate-50 border border-slate-200 rounded-xl py-2 px-4 text-xs md:text-sm focus:ring-2 focus:ring-blue-500 outline-none"
                        />
                    </div>

                    <div className="flex flex-wrap gap-1 bg-slate-100 p-1 rounded-lg text-[10px] font-bold">
                        {['Semua', 'Sosiologi', 'Geografi', 'Ekonomi', 'Sejarah'].map(tab => (
                            <button 
                                key={tab}
                                onClick={() => setFilterTab(tab)}
                                className={`flex-1 py-1 rounded cursor-pointer ${filterTab === tab ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}
                            >
                                {tab}
                            </button>
                        ))}
                    </div>

                    <div className="max-h-[220px] overflow-y-auto space-y-2 pr-1 custom-scrollbar">
                        {filtered.length > 0 ? filtered.map((item, idx) => {
                            let badgeStyle = 'bg-purple-100 text-purple-800';
                            if (item.subject === 'Geografi') badgeStyle = 'bg-teal-100 text-teal-800';
                            else if (item.subject === 'Ekonomi') badgeStyle = 'bg-emerald-100 text-emerald-800';
                            else if (item.subject === 'Sejarah') badgeStyle = 'bg-orange-100 text-orange-800';

                            return (
                                <div key={idx} className="p-3 bg-slate-50 border border-slate-200/50 rounded-xl space-y-1 text-xs">
                                    <div className="flex justify-between items-center">
                                        <strong className="text-slate-800">{item.term}</strong>
                                        <span className={`text-[8px] font-extrabold px-1.5 py-0.2 rounded uppercase ${badgeStyle}`}>{item.subject}</span>
                                    </div>
                                    <p className="text-[11px] text-slate-500 leading-relaxed">{item.definition}</p>
                                </div>
                            );
                        }) : <p className="text-center text-slate-400 text-xs py-4">Kata tidak ditemukan.</p>}
                    </div>
                </div>
            );
        }

        // 5. COMPONENT: INTERACTIVE QUIZ GAME 
        function QuizGame({ quiz, topicTitle, onComplete, onClose }) {
            const [currentIndex, setCurrentIndex] = useState(0);
            const [selectedOption, setSelectedOption] = useState(null);
            const [isAnswered, setIsAnswered] = useState(false);
            const [score, setScore] = useState(0);
            const [isFinished, setIsFinished] = useState(false);

            const handleCheck = () => {
                if (selectedOption === null || isAnswered) return;
                setIsAnswered(true);
                if (selectedOption === quiz[currentIndex].correctAnswer) {
                    setScore(prev => prev + 1);
                }
            };

            const handleNext = () => {
                if (currentIndex < quiz.length - 1) {
                    setCurrentIndex(prev => prev + 1);
                    setSelectedOption(null);
                    setIsAnswered(false);
                } else {
                    const pct = Math.round((score / quiz.length) * 100);
                    const pts = score * 50;
                    setIsFinished(true);
                    onComplete(pct, pts);
                }
            };

            return (
                <div className="bg-slate-50 border border-slate-200 rounded-2xl p-5 shadow-sm space-y-4">
                    {!isFinished ? (
                        <div className="space-y-4">
                            <div className="flex justify-between items-center">
                                <div>
                                    <span className="text-[10px] font-bold text-blue-600 uppercase tracking-wider block">Kuis Evaluasi</span>
                                    <h4 className="text-xs font-bold text-slate-600 truncate max-w-xs">{topicTitle}</h4>
                                </div>
                                <span className="text-xs font-bold text-slate-400">Soal {currentIndex + 1} dari {quiz.length}</span>
                            </div>

                            <div className="bg-white p-4 rounded-xl border border-slate-100 shadow-sm text-xs font-semibold leading-relaxed text-slate-800">
                                {quiz[currentIndex].question}
                            </div>

                            <div className="grid grid-cols-1 gap-2">
                                {quiz[currentIndex].options.map((opt, idx) => {
                                    let style = 'border-slate-200 hover:bg-slate-100 text-slate-700';
                                    if (selectedOption === idx && !isAnswered) {
                                        style = 'border-blue-500 bg-blue-50 text-blue-700 font-semibold';
                                    } else if (isAnswered) {
                                        if (idx === quiz[currentIndex].correctAnswer) {
                                            style = 'border-emerald-500 bg-emerald-50 text-emerald-800 font-bold';
                                        } else if (selectedOption === idx && idx !== quiz[currentIndex].correctAnswer) {
                                            style = 'border-red-500 bg-red-50 text-red-800';
                                        } else {
                                            style = 'border-slate-100 text-slate-400 bg-slate-50/50';
                                        }
                                    }
                                    return (
                                        <button 
                                            key={idx}
                                            onClick={() => !isAnswered && setSelectedOption(idx)}
                                            className={`text-left p-3.5 rounded-xl border text-xs cursor-pointer transition ${style}`}
                                            disabled={isAnswered}
                                        >
                                            {opt}
                                        </button>
                                    );
                                })}
                            </div>

                            {isAnswered && (
                                <div className="p-3 bg-slate-100 border border-slate-200 rounded-xl text-[11px] leading-relaxed text-slate-600 space-y-1">
                                    <strong className="text-slate-800 block">Pembahasan Soal:</strong>
                                    <p>{quiz[currentIndex].explanation}</p>
                                </div>
                            )}

                            <div className="flex justify-between items-center pt-3 border-t border-slate-200">
                                <button onClick={onClose} className="text-xs font-bold text-slate-400 hover:text-slate-600">Keluar Kuis</button>
                                {!isAnswered ? (
                                    <button 
                                        onClick={handleCheck}
                                        disabled={selectedOption === null}
                                        className="bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs py-2 px-5 rounded-xl cursor-pointer transition disabled:bg-slate-200"
                                    >
                                        Periksa Jawaban
                                    </button>
                                ) : (
                                    <button 
                                        onClick={handleNext}
                                        className="bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs py-2 px-5 rounded-xl cursor-pointer transition"
                                    >
                                        {currentIndex === quiz.length - 1 ? "Lihat Hasil" : "Berikutnya"}
                                    </button>
                                )}
                            </div>
                        </div>
                    ) : (
                        <div className="text-center py-6 space-y-4">
                            <div className="inline-block bg-yellow-400 text-white p-3.5 rounded-full shadow-lg text-lg">🏆</div>
                            <div className="space-y-1">
                                <h4 className="font-extrabold text-slate-800 text-base">Selamat, Kuis Selesai!</h4>
                                <p className="text-xs text-slate-500">Materi evaluasi mandiri selesai dipelajari.</p>
                            </div>
                            <div className="grid grid-cols-2 gap-3 max-w-xs mx-auto p-3 bg-white border border-slate-100 rounded-xl">
                                <div className="text-center border-r border-slate-100">
                                    <span className="text-[10px] text-slate-400 uppercase font-bold block">Nilai</span>
                                    <span className="text-xl font-black text-blue-600">{Math.round((score / quiz.length) * 100)}%</span>
                                </div>
                                <div className="text-center">
                                    <span className="text-[10px] text-slate-400 uppercase font-bold block">Bonus Poin</span>
                                    <span className="text-xl font-black text-amber-500">+{score * 50} XP</span>
                                </div>
                            </div>
                            <button onClick={onClose} className="bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs py-2 px-6 rounded-xl cursor-pointer transition">
                                Selesai Belajar
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        // 6. MAIN APP COMPONENT
        function App() {
            const [layer, setLayer] = useState('landing'); // landing, grades, subjects, topics, study
            const [selectedSubject, setSelectedSubject] = useState(null);
            const [selectedTopic, setSelectedTopic] = useState(null);

            const [isSpeaking, setIsSpeaking] = useState(false);

            const [progress, setProgress] = useState({
                completedTopics: [],
                quizScores: {},
                points: 100
            });

            useEffect(() => {
                const saved = localStorage.getItem('ips_harapan_siswa_progress');
                if (saved) {
                    try { setProgress(JSON.parse(saved)); } catch(e){}
                }
            }, []);

            useEffect(() => {
                // Instantly sync Lucide icons on DOM updates
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [layer, selectedSubject, selectedTopic, activeQuiz]);

            const saveProgress = (newProg) => {
                setProgress(newProg);
                localStorage.setItem('ips_harapan_siswa_progress', JSON.stringify(newProg));
            };

            const handleCompleteQuiz = (scorePct, ptsEarned) => {
                if (!selectedTopic) return;
                const completed = progress.completedTopics.includes(selectedTopic.id);
                const updatedCompleted = completed ? progress.completedTopics : [...progress.completedTopics, selectedTopic.id];
                const high = progress.quizScores[selectedTopic.id] || 0;
                const updatedScores = { ...progress.quizScores, [selectedTopic.id]: Math.max(high, scorePct) };
                
                saveProgress({
                    completedTopics: updatedCompleted,
                    quizScores: updatedScores,
                    points: progress.points + (completed ? Math.round(ptsEarned / 2) : ptsEarned)
                });
            };

            const handleCompleteFlash = (pts) => {
                saveProgress({ ...progress, points: progress.points + pts });
            };

            const toggleSpeech = (text) => {
                if ('speechSynthesis' in window) {
                    if (isSpeaking) {
                        window.speechSynthesis.cancel();
                        setIsSpeaking(false);
                    } else {
                        window.speechSynthesis.cancel();
                        const utterance = new SpeechSynthesisUtterance(text);
                        utterance.lang = 'id-ID';
                        utterance.rate = 0.95;
                        utterance.onend = () => setIsSpeaking(false);
                        utterance.onerror = () => setIsSpeaking(false);
                        setIsSpeaking(true);
                        window.speechSynthesis.speak(utterance);
                    }
                } else {
                    alert('Layanan narator suara tidak didukung di komputer Anda.');
                }
            };

            const resetProgress = () => {
                if (confirm('Apakah Anda yakin ingin mengulang progress belajar dari awal?')) {

            const getSubjectProgress = (sub) => {
                if (!sub.topics || sub.topics.length === 0) return 0;

                                            if (layer === 'study') { setLayer('topics'); setActiveQuiz(null); if('speechSynthesis' in window) window.speechSynthesis.cancel(); setIsSpeaking(false); }
                                            else if (layer === 'topics') setLayer('subjects');

                                            else if (layer === 'grades') setLayer('landing');
                                        }}

                                    >
                                        <i data-lucide="chevron-left" class="w-4 h-4 text-slate-600"></i>
                                    </button>
                                )}
                                <div>
                                    <h1 className="font-extrabold text-base md:text-lg tracking-tight text-slate-900 flex items-center gap-1.5">
                                        <span className="text-xl">🎓</span>
                                        <span>IPS Harapan Siswa</span>

                                    <p className="text-[10px] text-slate-400 hidden sm:block">SMK Harapan Siswa Bogor • Media Belajar Mandiri</p>
                                </div>

                            <div className="flex items-center gap-3 text-xs font-bold">
                                <div className="bg-amber-50 border border-amber-100 text-amber-900 rounded-full py-1 px-3 flex items-center gap-1">
                                    ⭐ <span>{progress.points} XP</span>
                                </div>
                                <div className="bg-blue-50 border border-blue-100 text-blue-900 rounded-full py-1 px-3 flex items-center gap-1">
                                    🏆 <span>Selesai: {progress.completedTopics.length}/8 Topik</span>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Main Area */}

                        {layer === 'landing' && (

                                                        </div>
                                                        <div className="w-full h-1 bg-slate-100 rounded-full overflow-hidden">
                                                            <div className="h-full bg-blue-600" style={{ width: `${pct}%` }}></div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </button>
                                        );
                                    })}
                                </div>
                                <div className="pt-6 border-t border-slate-200">
                                    <IpsGlossary />
                                </div>
                            </div>
                        )}

                        {/* TOPIC SELECTION */}
                        {layer === 'topics' && selectedSubject && (
                            <div className="space-y-6 max-w-2xl mx-auto">
                                <div className={`p-6 rounded-2xl ${selectedSubject.headerColor} text-white space-y-2`}>
                                    <span className="text-[10px] bg-white/25 px-2.5 py-0.5 rounded-full font-extrabold uppercase">{selectedSubject.name} - Kelas X</span>
                                    <h2 className="text-xl md:text-2xl font-black">{selectedSubject.topics.length} Materi Pembelajaran</h2>
                                    <div className="space-y-1 max-w-xs pt-1">
                                        <div className="flex justify-between text-xs font-semibold">
                                            <span>Progress Pembelajaran:</span>
                                            <span>{getSubjectProgress(selectedSubject)}%</span>
                                        </div>
                                        <div className="w-full h-1 bg-white/20 rounded-full overflow-hidden">
                                            <div className="h-full bg-white" style={{ width: `${getSubjectProgress(selectedSubject)}%` }}></div>
                                        </div>
                                    </div>
                                </div>

                                <div className="space-y-2">
                                    <span className="text-[10px] font-bold text-slate-400 block uppercase">Daftar Modul Materi Pembelajaran:</span>
                                    {selectedSubject.topics.map((topic, idx) => {
                                        const comp = progress.completedTopics.includes(topic.id);
                                        const score = progress.quizScores[topic.id];
                                        return (
                                            <button 
                                                key={topic.id}
                                                onClick={() => { setSelectedTopic(topic); setLayer('study'); }}
                                                className="w-full bg-white p-4 rounded-xl border border-slate-200 hover:border-blue-400 text-left transition flex items-center justify-between cursor-pointer"
                                            >
                                                <div className="flex items-center gap-3">
                                                    <div className={`w-8 h-8 rounded-lg flex items-center justify-center font-bold text-xs ${comp ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-600'}`}>
                                                        {comp ? "✅" : idx + 1}
                                                    </div>
                                                    <div>
                                                        <h4 className="font-bold text-slate-800 text-xs md:text-sm">{topic.title}</h4>
                                                        <p className="text-[10px] text-slate-400 mt-0.5">Estimasi Durasi: {topic.duration} • 3 Soal Kuis</p>
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-2">
                                                    {comp && <span className="text-[9px] bg-emerald-50 text-emerald-800 border border-emerald-200 px-1.5 py-0.2 rounded font-bold">Skor: {score}%</span>}
                                                    <span className={`text-[10px] font-black py-1 px-3.5 rounded-lg ${comp ? 'bg-slate-100 text-slate-600' : 'bg-blue-600 text-white'}`}>{comp ? "Tinjau" : "Mulai"}</span>
                                                </div>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* INTERACTIVE STUDY CORE */}
                        {layer === 'study' && selectedSubject && selectedTopic && (
                            <div className="space-y-6">
                                <div className="flex flex-wrap items-center justify-between gap-3 bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm text-xs md:text-sm font-semibold">
                                    <div className="flex items-center gap-1.5">
                                        <span className="text-slate-400">Kelas X</span>
                                        <span className="text-slate-300">/</span>
                                        <span className="text-slate-500">{selectedSubject.name}</span>
                                        <span className="text-slate-300">/</span>
                                        <strong className="text-blue-600 truncate max-w-xs">{selectedTopic.title}</strong>
                                    </div>
                                    <button 
                                        onClick={() => setActiveQuiz(activeQuiz ? null : selectedTopic)}
                                        className="bg-blue-600 text-white font-extrabold text-[11px] py-1.5 px-4 rounded-xl cursor-pointer hover:bg-blue-700 transition"
                                    >
                                        {activeQuiz ? "Kembali Membaca Materi" : "Uji Pemahaman (Kuis)"}
                                    </button>
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                                    {/* Left Article reading */}
                                    <div className="lg:col-span-7 space-y-6">
                                        <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-4">
                                            <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                                                <span className="bg-blue-100 text-blue-800 text-[10px] font-black px-2 py-0.5 rounded uppercase">Modul {selectedSubject.name}</span>
                                                <span className="text-[11px] text-slate-400 font-medium">Baca: {selectedTopic.duration}</span>
                                            </div>

                                            <h2 className="text-lg md:text-xl font-black text-slate-900 leading-tight">{selectedTopic.title}</h2>

                                            {/* Offline TTS speech voice */}
                                            <div className="flex items-center justify-between p-3 bg-slate-50 border border-slate-200/80 rounded-xl text-xs">
                                                <div className="flex items-center gap-2">
                                                    <span className="text-lg">🗣️</span>
                                                    <div>
                                                        <strong className="text-slate-800 block">Narator Suara Otomatis</strong>
                                                        <span className="text-[10px] text-slate-400">Dengar materi via audio robot browser (Offline)</span>
                                                    </div>
                                                </div>
                                                <button 
                                                    onClick={() => toggleSpeech(selectedTopic.content.join(' '))}
                                                    className={`py-1 px-3 rounded-lg font-bold border transition cursor-pointer ${isSpeaking ? 'bg-red-50 text-red-600 border-red-200' : 'bg-blue-50 text-blue-600 border-blue-200'}`}
                                                >
                                                    {isSpeaking ? "Berhenti" : "Dengarkan"}
                                                </button>
                                            </div>

                                            <div className="space-y-4 text-xs md:text-sm text-slate-700 leading-relaxed text-justify">
                                                {selectedTopic.content.map((p, i) => <p key={i} className="indent-5">{p}</p>)}
                                            </div>

                                            {progress.completedTopics.includes(selectedTopic.id) && (
                                                <div className="bg-emerald-50 border border-emerald-100 text-emerald-900 p-3 rounded-xl text-xs font-bold flex items-center gap-2">
                                                    <span>✅</span>
                                                    <span>Luar biasa! Kamu sudah lulus kuis materi pembelajaran ini!</span>
                                                </div>
                                            )}
                                        </div>

                                        <TopicVisualizer topicId={selectedTopic.id} />
                                    </div>

                                    {/* Right Quiz & Cards side decks */}
                                    <div className="lg:col-span-5 space-y-6">
                                        {activeQuiz ? (
                                            <QuizGame 
                                                quiz={selectedTopic.quiz}
                                                topicTitle={selectedTopic.title}
                                                onComplete={handleCompleteQuiz}
                                                onClose={() => setActiveQuiz(null)}
                                            />
                                        ) : (
                                            <div className="bg-gradient-to-tr from-slate-900 to-indigo-950 text-white rounded-2xl p-5 shadow-lg space-y-3">
                                                <div className="flex items-center gap-2">
                                                    <span>💡</span>
                                                    <strong className="text-sm font-black block">Mulai Kuis Sekarang!</strong>
                                                </div>
                                                <p className="text-[11px] text-slate-300 leading-relaxed">Uji pemahaman belajarmu dengan kuis interaktif 3 pertanyaan pilihan ganda disertai pembahasan lengkap demi memperoleh tambahan <strong>+50 XP</strong>!</p>
                                                <button 
                                                    onClick={() => setActiveQuiz(selectedTopic)}
                                                    className="w-full bg-blue-600 hover:bg-blue-500 text-white font-extrabold text-xs py-2 px-4 rounded-xl cursor-pointer transition shadow-md"
                                                >
                                                    Mulai Kuis Interaktif
                                                </button>
                                            </div>
                                        )}

                                        <FlashcardsGame 
                                            topicId={selectedTopic.id}
                                            onComplete={handleCompleteFlash}
                                        />
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Footer bar */}
                    <footer className="bg-slate-950 text-slate-500 py-6 px-4 mt-12 border-t border-slate-900 text-center text-[11px] space-y-1.5">
                        <strong className="text-slate-400 block">© 2026 SMK Harapan Siswa Bogor</strong>
                        <p className="max-w-md mx-auto text-slate-600 leading-relaxed">Media pembelajaran digital IPS kelas X mandiri dengan kuis interaktif, flashcards, dan infografis. Berjalan 100% offline & client-side.</p>
                    </footer>
                </div>
            );
        }

        // Render React App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
